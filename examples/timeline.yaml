# 时间轴配置示例
# 每个事件定义一个 (时间点, prompt) 对
# 调度器会在指定时间（秒）自动投喂 prompt

events:
  - time: 0
    prompt: "一只橘猫坐在窗台上，夕阳洒在毛发上，温暖的色调"
    label: "开场"

  - time: 12
    prompt: "猫站起身，伸了个懒腰，准备跳下窗台"
    label: "动作"

  - time: 24
    prompt: "猫轻巧地跳上屋顶，月光下的剪影"
    label: "转场"

  - time: 36
    prompt: "猫在屋顶上行走，远处城市灯火闪烁"
    label: "氛围"

  - time: 48
    prompt: "猫停下脚步，回头望了一眼，消失在夜色中"
    label: "结尾"
