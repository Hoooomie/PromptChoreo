# PixVerse World 时间轴

initial_prompt: "A dog is running."
end_delay: 10

# 外部录屏（EV录屏等），不需要时删掉整个 recorder 块即可
recorder:
  enabled: true
  start_hotkey: "ctrl+f1"
  stop_hotkey: "ctrl+f2"

events:
  - time: 10
    prompt: "The dog falls."
    label: "注入1"

  - time: 20
    prompt: "It jumps high."
    label: "注入2"

  - time: 30
    prompt: "It runs away."
    label: "注入3"
